# Downloads every file listed in media.json (ElevenLabs renders behind short-lived signed URLs)
# into public/media and commits them, so builds never depend on the expiring links.
name: Persist media
on:
  push:
    branches: ['**']
    paths: [media.json, scripts/fetch-media.mjs, .github/workflows/persist-media.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: persist-media
  cancel-in-progress: false
jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-media.mjs
      - name: Commit downloaded media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media
          if git diff --cached --quiet; then echo "No new media"; exit 0; fi
          git commit -m "Persist media files from media.json"
          git push
